# SpecClaw Configuration
# Generated by: specclaw init
version: 1

project:
  name: "claudevid"
  description: ""
  repo: ""

# Model routing — use the best model for each phase
models:
  planning: "anthropic/claude-opus-4-8"      # Proposals, specs, design
  coding: "anthropic/claude-sonnet-5"        # Implementation
  review: "anthropic/claude-sonnet-5"        # Verification & code review

# Git strategy
#
# Git strategies:
#   branch-per-change    — one branch per change, switches working directory (default)
#   direct               — commits straight to current branch
#   worktree-per-change  — isolated worktree per change, enables parallel multi-change builds
git:
  strategy: "branch-per-change"   # "branch-per-change" | "direct" | "worktree-per-change"
  base_branch: ""                 # Branch to fork changes from and target PRs/merges at.
                                  # Empty = auto-detect: origin/HEAD, then gh default branch,
                                  # then main/master. Set explicitly for release-branch flows.
  auto_commit: true
  commit_prefix: "specclaw"       # Prefix for auto-commits
  branch_prefix: "specclaw/"      # Prefix for feature branches
  worktree_dir: ".specclaw/worktrees"  # Base directory for worktrees (worktree-per-change only)

# Grounded context discovery — auto-discover project docs (README, CLAUDE.md,
# docs/, llms.txt, ...) and inject them into plan/build/verify payloads.
# Filter precedence per file: exclude match -> out; folders non-empty and file
# outside -> out; otherwise in. pin entries bypass filtering and ranking.
# Pattern forms for exclude: simple name ("node_modules" — matches that path
# segment anywhere), root-relative ("./x"), glob ("*.gen.md", "**/dist").
context:
  discovery: true                  # false = no discovery, phases behave as before
  max_lines: 3000                  # total line budget for injected docs
  folders: []                      # restrict discovery to these dirs (empty = whole repo)
  pin: []                          # always-include paths (exact, repo-relative)
  # Example: after running /specclaw:bf-analyze, /specclaw:bf-architecture, and
  # /specclaw:bf-domain, pin their output so /specclaw:plan, /specclaw:build,
  # and /specclaw:verify treat it as authoritative context. Requires
  # `git add .specclaw/analysis/*.md` first (discovery enumerates via
  # `git ls-files`) and raising max_lines accordingly — see
  # docs/rebuild-workflow.md for the full recipe, incl. max_lines sizing:
  #   pin:
  #     - .specclaw/analysis/codebase-report.md
  #     - .specclaw/analysis/architecture.md
  #     - .specclaw/analysis/domain-model.md
  #     - .specclaw/analysis/functional-spec.md
  exclude: []                      # patterns to skip

# Build settings
build:
  test_command: ""                 # Fast tier: unit/integration. e.g., "npm test", "pytest"
  e2e_command: ""                  # Slow tier: browser/e2e. e.g., "npx playwright test"
                                   # Run separately from test_command, per verify.e2e below.
                                   # Absent or empty → no e2e tier, behaviour unchanged.
  lint_command: ""                 # e.g., "npm run lint"
  build_command: ""                # e.g., "npm run build"
  parallel_tasks: 3               # Max concurrent agent spawns
  timeout_seconds: 300             # Per-task timeout

  # Memory-aware parallelism (opt-in). Lowers effective build concurrency
  # when free RAM is tight; absent → parallel_tasks used unchanged.
  memory:
    min_free_mb: 1024             # RAM floor (MB) kept free before spawning another agent
    per_agent_mb: 1024            # Estimated RAM (MB) reserved per parallel agent

  # Dynamically synthesized per-task build subagents (opt-in).
  # When enabled, each build task gets a bespoke agent: kind-classified,
  # minimal tools, cost-aware Claude model from the ladder below. Default
  # off — build dispatches the generic coder exactly as before.
  dynamic_agents:
    enabled: false
    ladder:                                    # task tier -> model (cheap -> strong)
      trivial:  "anthropic/claude-haiku-4-5"   # docs / rename / config
      standard: "anthropic/claude-sonnet-5"    # normal impl / test / refactor
      complex:  "anthropic/claude-opus-4-8"    # large / cross-module
      extreme:  "anthropic/claude-fable-5"     # highly-complex only (see cap)
    max_model: "anthropic/claude-opus-4-8"     # ceiling; extreme requires explicit highly-complex mark
    fable_max_fraction: 0.2                     # cap Fable share of tasks per build
    cache: true                                 # persist synthesized specs under changes/<change>/agents/

# Verify settings
verify:
  # When the slow tier (build.e2e_command) runs. Absent → "last".
  #   skip   — never run e2e during verify
  #   last   — run e2e only after lint, build and test all pass
  #   always — run e2e even when an earlier gate failed
  e2e: last
  heartbeat_seconds: 60            # Liveness heartbeat interval for long commands (stderr)
  playwright:
    max_browsers: 2                # Hard cap on concurrent Playwright/Chromium instances across all agents
    max_memory_mb: 4096            # Memory ceiling (MB) per e2e invocation, applied via systemd-run --scope
                                   # Absent → 4096. systemd-run unusable → command runs uncapped (warned).
    projects: []                   # Playwright project names to run one-per-invocation, sequentially
                                   # Absent or empty → a single invocation, no --project flag added.

# Notifications
notifications:
  enabled: true
  channel: "discord"              # "discord" | "telegram" | "slack"
  target: ""                      # Channel/user ID for updates
  on_complete: true
  on_failure: true
  on_approval_needed: true

# GitHub Issues integration (optional)
# When enabled, syncs proposals as GitHub Issues with task checklists
github:
  sync: false                    # Enable GitHub Issues sync
  repo: ""                       # owner/repo (auto-detected from git remote if empty)
  token: ""                      # GitHub PAT for curl fallback (not needed if gh CLI is authed)
  label: "specclaw"              # Label applied to SpecClaw issues

# Workflow enforcement
workflow:
  strict: true                     # Enforce phase prerequisites (disable for rapid prototyping)
  code_review: false               # Spawn code-reviewer agent during /specclaw:verify
  code_review_block: false         # Block /specclaw:pr if code review verdict is CHANGES_REQUESTED

# Autonomous build→verify→review loop (loop engineering)
# When enabled, build/verify/review iterate until all gates are green or a guardrail halts.
loop:
  enabled: true            # default-on; set false for single-pass build/verify
  max_iterations: 5        # local inner loop cap
  no_progress_limit: 2     # consecutive identical/empty turns → halt
  guard_action: "revert-tests"   # reward-hack guard: revert-tests | revert-turn
  test_paths: []           # globs identifying test files (reward-hack guard)
  ci_gate: false           # opt-in outer CI loop (GitHub Actions / Azure Pipelines)
  ci_max_iterations: 3     # CI outer loop cap
  ci_timeout_seconds: 1200 # per-cycle CI wall-clock before halt

# Party mode — an adversarial panel that argues a proposal before it becomes a plan
# A haiku classifier sizes the panel to the proposal; role-specialised subagents
# critique it from non-overlapping angles and `specclaw-party` tallies the verdict.
# Ships inert: seated but opt-in per run, and never blocking.
party:
  enabled: true            # false = /specclaw:propose behaves exactly as before — no prompt, no files, no spawns
  default: false           # true = convene without asking; false = ask once, quoting the roster and the spawn count
  on_loop_halt: false      # true = also convene the panel when /specclaw:loop halts, against the halt
  rounds: 2                # 2 = findings then a rebuttal round; 1 = no rebuttal, roughly halves the bill
  block: false             # true = a CHANGES_REQUESTED verdict is a hard stop for /specclaw:plan
  panel_mode: dynamic      # dynamic = the classifier picks the tier; fixed = use `panel` below verbatim, no classifier call
  panel: [party-po, party-architect, party-ba, party-visionary]  # the roster panel_mode: fixed takes verbatim
  always: []               # seats forced onto every panel whatever the tier, e.g. [party-security]
  min_seats: 2             # floor — a short panel is grown along the tier order
  max_seats: 6             # ceiling — surplus seats drop from the tail (Visionary/Security before Architect/PO)
  models:                  # per-seat model; a seat left out falls through to its agent charter's own `model:`
    party-classifier: haiku
    party-visionary: fable
    party-architect: opus
    party-security: opus
    party-ba: sonnet
    party-po: sonnet

# Automation
automation:
  auto_mode: false
  cron: ""                         # Cron expression for scheduled builds
  max_tasks_per_run: 5
  auto_verify: true                # Run verification after build
  auto_archive: false              # Archive on successful verification
  post_build_review: true          # Run automated review after build completes

# PR creation settings
pr:
  test_policy: ""   # Set on first `specclaw pr` run. Options: none | unit | e2e | both
                    # none  — no test checks before PR creation
                    # unit  — requires unit test evidence in verify-report + build.test_command set
                    # e2e   — requires e2e test evidence in verify-report + build.test_command set
                    # both  — requires unit + e2e evidence

# Code quality thresholds (optional — /specclaw:bf-quality only)
#
# The ONLY place these numbers live. The collector holds the same values as its
# documented defaults and reads nothing else, so a policy change is a config
# edit rather than a code edit — and any status in a quality report can be
# checked against the block that produced it.
#
# A metric no available tool can compute for a language is reported as
# NOT-MEASURED with a reason, never estimated, so raising a threshold never
# manufactures coverage. Nothing here gates anything: quality runs are advisory
# unless invoked as `--compare --gate`.
quality:
  complexity_warn: 10          # cyclomatic complexity per function
  complexity_high: 20
  function_length_warn: 60     # lines per function
  function_length_high: 120
  duplication_warn: 5          # percent duplicated lines, per module
  duplication_high: 15
  file_length_warn: 500        # lines per file
  file_length_high: 1000

  # Which severity band earns a permanent QI-### id. HIGH | WARN.
  # HIGH by default and deliberately: QI ids are permanent and entries are never
  # deleted, so registering every WARN on a large legacy tree accumulates
  # thousands of rows that outlive the code they describe. WARN findings are
  # still counted in every module rollup — they are just not individually
  # immortalised.
  register_severity: HIGH

  # Which severity band earns a REBUILD REMEDIATION BACKLOG ITEM in
  # /specclaw:bf-rebuild-plan. HIGH | WARN.
  #
  # Deliberately INDEPENDENT of register_severity above. That one decides which
  # hotspots get a permanent QI-### id; this one decides which of those the
  # rebuild is held ACCOUNTABLE for. A project can immortalise every WARN and
  # still only be answerable for the HIGH ones.
  #
  # A QI below this floor generates no backlog item — it is reported as an
  # advisory count on its module's coverage-rollup line, so it stays visible
  # without becoming something the rebuild must clear.
  remediation_severity_floor: HIGH

  # ── Duplication clone pairs ────────────────────────────────────────────────
  #
  # The per-module duplication percentage above says HOW MUCH code is
  # duplicated. These control the other half of the question — WHERE — by
  # preserving the clone pairs the detector found: two file:line ranges, the
  # duplicated line count, and the module each side belongs to.
  #
  # No duplicated SOURCE is ever stored or reported. Each clone carries its two
  # locations and a hash of the normalised fragment, which is its stable
  # identity across runs; the ranges point at code that is already in the
  # repository. A quality report is the artifact most likely to be forwarded
  # outside the team, and one that embeds source cannot be.
  clone_qi_min_lines: 30       # a clone at or above this many duplicated lines
                               # earns a permanent QI-### and enters the same
                               # accountability chain as every other hotspot.
                               # This is the whole significance judgement, so
                               # everything registered is HIGH — quality.register_severity
                               # picks a band and a clone has no band.

  clone_function_min_overlap: 0.5   # a function name is attached to a clone side
                               # only when that function CONTAINS the clone's
                               # start line and covers at least this fraction of
                               # the clone's lines. Anything else — a clone
                               # straddling two functions, a language with no
                               # function-level measurement, two functions both
                               # qualifying — reports file:range with no name.
                               # Never a nearest-match guess.

  clone_capture_top_n: 50      # how many clones quality.json stores, largest
                               # first. Truncation is always visible in the
                               # census; QI registration is NOT bounded by this,
                               # so a permanent id is never lost to a display cap.

  clone_report_top_m: 10       # how many the report's hotspot section shows.

  # ── Scan scope: what the quality scan measures ─────────────────────────────
  #
  # The scan measures production code. Generated migrations, designer files,
  # minified bundles, vendored dependencies and test suites are excluded by
  # default, because a hotspot in a file nobody maintains is not a finding about
  # this project's code — and left in, it distorts module rollups, duplication
  # percentages and the legacy-vs-target compare.
  #
  # THE DEFAULT PATTERNS ARE NOT HERE. They ship with the plugin, in
  # lib/quality-exclusions.yaml, grouped into the five categories named below.
  # Read that file to see exactly what each category matches and why; it also
  # documents the matching semantics in full. This block is the PROJECT layer
  # that overlays them.
  #
  # Matching, in one line: globs against repo-relative paths, case-insensitive,
  # `**` crosses directories and `*` does not, and `**/x` matches `x` at any
  # depth including the repo root.
  #
  # NOTHING IS HIDDEN. Every excluded file is counted, per category, into
  # quality.json's `exclusions.census` and narrated in the report's "Scan scope"
  # section. The effective set is hashed, and `--compare` refuses to compute a
  # delta across two snapshots whose hashes differ rather than silently
  # comparing two different denominators.
  exclusions:

    # Each category on or off independently. Switching one off does not delete
    # its patterns — they live in lib/quality-exclusions.yaml and come back the
    # moment this flips to true.
    generated: true
    third_party_and_build: true
    tests: true
    pipeline_owned: true
    data_and_lockfiles: true

    # Measure test code into its OWN reported bucket instead of leaving it out.
    # Requires `tests: true` above — this decides where the test files go, not
    # whether they are separated. Test code is never folded into a production
    # module rollup either way: its norms are different (long fixture builders,
    # repetitive arrange/assert blocks that read as duplication) and mixing the
    # two makes both numbers mean less.
    tests_as_separate_bucket: false

    # This project's own additions. Same glob syntax.
    #   - "**/ThirdPartyControls/**"
    extra_excludes: []

    # Files forced back IN despite matching an enabled category. Always wins.
    #
    # This is the escape hatch for the one trap in the defaults:
    # `third_party_and_build` excludes `bin/`, `build/`, `out/`, `target/` and
    # `packages/`, which are build-output directories in .NET, Maven/Gradle,
    # Rust and NuGet — and legitimate SOURCE directories in shell, Go, Python
    # and plugin repos. If this project keeps source in one of them, name it
    # here rather than switching the whole category off:
    #   - "bin/**"
    #   - "src/db/Migrations/HandWrittenBackfill.cs"
    include_overrides: []

# Plugin housekeeping
plugin:
  update_check: true   # /specclaw:status checks the plugin repo for a newer published
                       # version (max once/24h, cached in .specclaw/.update-check —
                       # add that file to .gitignore). Fail-silent: network problems
                       # never affect any command. Set false for zero network calls.

# Azure DevOps integration (optional)
# Run `specclaw auth azdo` to configure. Token stored in .specclaw/.env (gitignored).
azdo:
  enabled: false
  org: ""           # Organisation name — part after dev.azure.com/
  project: ""       # ADO project name
  repo: ""          # Repository name within the project
  boards:
    sync: false             # Set true to mirror proposals as Azure Boards Work Items
    work_item_type: "Feature"  # "Feature" | "User Story" | "Task" | "Bug" | "Epic"
    tag: "specclaw"         # Comma-separated. Tags help filter specclaw items in Boards queries.

# Jira integration (optional)
# Run `specclaw auth jira` to configure. Token stored in .specclaw/.env (gitignored).
jira:
  enabled: false
  domain: ""        # e.g. mycompany.atlassian.net
  email: ""         # Atlassian account email
  project_key: ""   # Project key shown in issue IDs, e.g. PROJ
  issue_type: "Story"  # Default issue type: Story | Task | Bug | Epic
